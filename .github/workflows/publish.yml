name: Release npm package
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
permissions:
  contents: write
  id-token: write
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          scope: '@mortz.prk'
      - run: npm install --global npm@11
      - run: npm exec --yes --package=bun@1.4.3 -- bun install --frozen-lockfile --ignore-scripts
      - run: npm exec --yes --package=bun@1.4.3 -- bun test
      - run: npm run lint
      - run: npm run typecheck
      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          TAG=$(npm version "$BUMP" --no-git-tag-version --ignore-scripts)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: npm pack --dry-run --ignore-scripts
      - name: Commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push --atomic origin HEAD:main "$TAG"
      - run: npm publish --access public --ignore-scripts --registry=https://registry.npmjs.org
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
