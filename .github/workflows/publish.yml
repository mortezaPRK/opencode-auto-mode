name: Release npm package
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
permissions:
  contents: write
  id-token: write
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          scope: '@mortz.prk'
      - run: npm install --global npm@11
      - run: npm exec --yes --package=bun@1.4.3 -- bun install --frozen-lockfile --ignore-scripts
      - run: npm exec --yes --package=bun@1.4.3 -- bun test
      - run: npm run lint
      - run: npm run typecheck
      - name: Build GUI bundle
        run: npm run build:gui
      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          TAG=$(npm version "$BUMP" --no-git-tag-version --ignore-scripts)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Verify the GUI bundle is packaged
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          tar -tzf "$RUNNER_TEMP"/*.tgz | grep -qx 'package/dist/gui-experimental.cjs'
      - name: Commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push --atomic origin HEAD:main "$TAG"
      - run: npm publish --access public --ignore-scripts --registry=https://registry.npmjs.org
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
