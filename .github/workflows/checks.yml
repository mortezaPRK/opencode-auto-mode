name: PR checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm exec --yes --package=bun@1.4.3 -- bun install --frozen-lockfile --ignore-scripts
      - name: Test
        run: npm exec --yes --package=bun@1.4.3 -- bun test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
